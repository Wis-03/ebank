server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API du chatbot : le navigateur appelle /chatbot/... sur la meme origine,
    # Nginx relaie vers l'API Gateway sur le reseau Docker (aucun appel direct au port hote 8080).
    location /chatbot/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Uploads image / audio / PDF (10 Mo maximum, comme le chatbot).
        client_max_body_size 10m;
        # Un cycle ReAct (plusieurs appels LLM et outils) peut depasser le delai par defaut de 60 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Application Angular (page unique) : toute autre route renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
