spring.application.name=discovery-service
server.port=8761

# Le serveur Eureka ne s'enregistre pas aupres de lui-meme
# et ne recupere pas le registre d'un autre noeud (mode standalone).
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost

# URL du registre. C'est exactement la valeur que les futurs microservices
# (ebank-service, mcp-server, ebank-chatbot-service, gateway, config-service)
# devront reprendre dans leur propriete eureka.client.service-url.defaultZone
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# En mode standalone de developpement, le self-preservation fausse l'etat du
# registre quand on redemarre souvent les services : on le desactive.
eureka.server.enable-self-preservation=false
