spring.application.name=ebank-chatbot-service

# Toute la configuration NON sensible de ce service est servie par le Config Server
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Secrets : volontairement NON centralises dans le Config Server, dont le depot
# de configuration est versionne. A externaliser en variables d'environnement
# avant tout push Git.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.datasource.password=${PGVECTOR_PASSWORD}
telegram.api.key=${TELEGRAM_BOT_TOKEN:}

# Fournisseur unique : OpenAI, pour le LLM, les embeddings du RAG et le speech-to-text.
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.model.audio.transcription=openai
