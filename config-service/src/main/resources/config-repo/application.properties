# Configuration commune a TOUS les microservices clients du Config Server.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Les services s'enregistrent avec leur adresse IP plutot qu'avec le nom
# d'hote de la machine. Sans cela, le Gateway resout bien lb://NOM-SERVICE
# via Eureka mais echoue ensuite sur le nom d'hote Windows, non resolvable
# en DNS (UnknownHostException / NXDOMAIN).
eureka.instance.prefer-ip-address=true
