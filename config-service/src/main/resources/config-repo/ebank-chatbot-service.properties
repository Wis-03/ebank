server.port=8098

# Modele LLM. La cle d'API n'est PAS centralisee ici : elle reste en local
# dans le service, pour ne jamais exposer de secret dans un fichier versionne.
spring.ai.openai.chat.options.model=gpt-4o

# ---------------------------------------------------------------------------
# RAG : Embeddings -> Vector Store -> Semantic Search
# ---------------------------------------------------------------------------
# Modele d'embedding explicite (sinon Spring AI 1.1.0-M4 prend text-embedding-ada-002).
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Vector Store PostgreSQL + pgvector (docker-compose.yml, service pgvector).
# Le mot de passe reste local au service (variable PGVECTOR_PASSWORD).
spring.datasource.url=jdbc:postgresql://localhost:5433/ebank_rag
spring.datasource.username=postgres
# Cree les extensions vector/hstore/uuid-ossp et la table vector_store si absentes.
spring.ai.vectorstore.pgvector.initialize-schema=true
# 1536 = dimension mesuree des vecteurs renvoyes par text-embedding-3-small.
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Ingestion : PDF de src/main/resources/rag/docs, decoupes en chunks d'environ
# 300 tokens (une section de document par chunk, au lieu d'une page entiere).
rag.docs.location=classpath:rag/docs/*.pdf
rag.chunk-size=300

# Recherche semantique : 4 chunks au plus ; en dessous du seuil de similarite,
# un chunk est juge non pertinent.
# Seuil calibre par mesure (similarite cosinus, text-embedding-3-small).
# Corpus PDF seul : pertinent 0.638-0.809, hors corpus 0.213-0.411 -> 0.5 suffisait.
# Recalibre apres ajout des images et de l'audio (requetes courtes reformulees par le LLM) :
#   pertinent : 0.455 (audio) a 0.673 ; hors corpus : 0.272 a 0.485.
# Les deux groupes se chevauchent : 0.45 laisse passer toutes les requetes pertinentes mesurees
# et bloque la majorite du hors corpus ; au-dela, le prompt interdit d'utiliser un contenu absent.
rag.search.top-k=4
rag.search.similarity-threshold=0.45

# ---------------------------------------------------------------------------
# Multimodal RAG : images et audio, stockes dans la meme table vector_store
# ---------------------------------------------------------------------------
# Image -> GPT-4o Vision -> description semantique -> embedding texte.
rag.images.location=classpath:rag/images/*.png
rag.images.description-model=gpt-4o
# Audio -> Whisper -> transcription -> chunks -> embedding texte.
rag.audio.location=classpath:rag/audio/*.wav
# Speech-to-text (ingestion audio et notes vocales Telegram).
# Temperature 0 : transcription la plus fidele (le defaut Spring AI est 0.7).
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=fr
spring.ai.openai.audio.transcription.options.temperature=0

# Serveurs MCP consommes par l'agent
spring.ai.mcp.client.streamable-http.connections.mcprh.url=http://localhost:8989/mcp
spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8077/mcp
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8066/mcp

# telegrambots-spring-boot-starter embarque jersey-client. Sans cette ligne,
# Spring Cloud croit devoir utiliser le transport Jersey et ne cree aucun bean
# TransportClientFactories, ce qui fait echouer l'enregistrement Eureka.
eureka.client.jersey.enabled=false

# ---------------------------------------------------------------------------
# Agentic AI : cycle ReAct explicite (ReActAdvisor)
# ---------------------------------------------------------------------------
# Nombre maximal d'iterations Reasoning -> Action -> Observation par requete.
react.max-iterations=5

# Uploads de l'interface web multimodale (image, audio, PDF) : 1 Mo par defaut dans Spring Boot.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
