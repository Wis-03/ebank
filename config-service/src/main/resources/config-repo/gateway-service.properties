server.port=8080

# Routage par decouverte Eureka : les URI lb://NOM-EUREKA sont resolues
# dynamiquement par spring-cloud-loadbalancer. Aucune URL ni aucun port
# de microservice n'est code en dur ici.

# /ebank/**   -> EBANK-SERVICE          ex: /ebank/bankAccounts -> /bankAccounts
spring.cloud.gateway.server.webflux.routes[0].id=ebank-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://EBANK-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ebank/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# /mcp-rh/**  -> MCP-SERVER             ex: /mcp-rh/mcp -> /mcp
# Le prefixe est /mcp-rh et non /mcp : avec StripPrefix=1, un prefixe /mcp
# transformerait /mcp en / et n'atteindrait jamais l'endpoint MCP reel.
spring.cloud.gateway.server.webflux.routes[1].id=mcp-server
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MCP-SERVER
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/mcp-rh/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# /chatbot/** -> EBANK-CHATBOT-SERVICE  ex: /chatbot/chat?query=... -> /chat?query=...
spring.cloud.gateway.server.webflux.routes[2].id=ebank-chatbot-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://EBANK-CHATBOT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/chatbot/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# /customers/** -> CUSTOMER-SERVICE     ex: /customers -> /customers
# Pas de StripPrefix ici : l'endpoint reel du service EST /customers, donc
# StripPrefix=1 le transformerait en / et n'atteindrait jamais le controleur.
spring.cloud.gateway.server.webflux.routes[3].id=customer-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/customers/**

# CORS minimal pour le frontend Angular (ng serve, http://localhost:4200) :
# sans ces lignes, le navigateur bloque l'appel GET /chatbot/chat (pas d'en-tete Access-Control-Allow-Origin).
# POST : envois multipart de l'interface multimodale (/chatbot/chat/image, /chat/audio, /chat/pdf).
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/chatbot/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/chatbot/**].allowed-methods=GET,POST
