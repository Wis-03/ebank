spring.application.name=config-service
server.port=8888

# Backend "native" : le depot de configuration est embarque dans ce module.
# Le dossier est nomme config-repo (et non config) car classpath:/config est
# deja un emplacement de configuration par defaut de Spring Boot : les fichiers
# servis seraient alors charges comme configuration du Config Server lui-meme.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo

# Enregistrement aupres du Discovery Service (Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
